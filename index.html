<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Core Engine</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #030307;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .viewport {
            width: 100vw;
            height: 100vh;
            position: relative;
            background: #04040c;
            overflow: hidden;
        }

        #webgl-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        .controls-overlay {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            z-index: 10;
            pointer-events: none;
        }

        .mic-wrapper {
            position: relative;
            width: 70px;
            height: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
        }

        .plasma-wave {
            position: absolute;
            width: 180px;
            height: 45px;
            background: linear-gradient(90deg, 
                rgba(236, 72, 153, 0) 0%, 
                rgba(236, 72, 153, 0.6) 30%, 
                rgba(99, 102, 241, 0.6) 70%, 
                rgba(99, 102, 241, 0) 100%);
            border-radius: 50%;
            filter: blur(12px);
            mix-blend-mode: screen;
            animation: fluidPulse 2.5s infinite ease-in-out;
        }

        .plasma-wave-secondary {
            position: absolute;
            width: 140px;
            height: 35px;
            background: linear-gradient(-90deg, 
                rgba(168, 85, 247, 0) 0%, 
                rgba(168, 85, 247, 0.5) 35%, 
                rgba(6, 182, 212, 0.5) 65%, 
                rgba(6, 182, 212, 0) 100%);
            border-radius: 50%;
            filter: blur(10px);
            mix-blend-mode: screen;
            animation: fluidPulse 1.8s infinite ease-in-out reverse;
        }

        .mic-trigger {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0.03) 100%);
            border: 1px solid rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 
                inset 0 1px 1px rgba(255,255,255,0.4),
                0 10px 25px rgba(0, 0, 0, 0.5),
                0 0 15px rgba(139, 92, 246, 0.2);
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 5;
            transition: transform 0.2s ease, border-color 0.3s ease;
        }

        .mic-trigger:active {
            transform: scale(0.95);
            border-color: rgba(168, 85, 247, 0.6);
        }

        .mic-icon {
            width: 18px;
            height: 18px;
            fill: #ffffff;
            opacity: 0.95;
            filter: drop-shadow(0 0 4px rgba(255,255,255,0.5));
        }

        @keyframes fluidPulse {
            0% { transform: scaleX(0.9) scaleY(0.8) rotate(-2deg); opacity: 0.6; }
            50% { transform: scaleX(1.1) scaleY(1.2) rotate(3deg); opacity: 0.9; filter: blur(10px); }
            100% { transform: scaleX(0.9) scaleY(0.8) rotate(-2deg); opacity: 0.6; }
        }
    </style>
</head>
<body>

    <div class="viewport">
        <div id="webgl-container"></div>

        <div class="controls-overlay">
            <div class="mic-wrapper">
                <div class="plasma-wave"></div>
                <div class="plasma-wave-secondary"></div>
                <button class="mic-trigger" aria-label="Voice Activation">
                    <svg class="mic-icon" viewBox="0 0 24 24">
                        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.49 6-3.31 6-6.72h-1.7z"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

    <script>
        const container = document.getElementById('webgl-container');

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 100);
        camera.position.z = 3.5;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        const vertexShader = `
            uniform float uTime;
            uniform float uNoiseFreq;
            uniform float uNoiseAmp;
            uniform float uPixelRatio;
            
            attribute float aRandom;
            
            varying vec3 vPosition;
            varying float vNoise;
            varying float vRandom;

            vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
            vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }

            float snoise(vec3 v) {
                const vec2 C = vec2(1.0/6.0, 1.0/3.0) ;
                const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
                vec3 i  = floor(v + dot(v, C.yyy) );
                vec3 x0 =   v - i + dot(i, C.xxx) ;
                vec3 g = step(x0.yzx, x0.xyz);
                vec3 l = 1.0 - g;
                vec3 i1 = min( g.xyz, l.zxy );
                vec3 i2 = max( g.xyz, l.zxy );
                vec3 x1 = x0 - i1 + C.xxx;
                vec3 x2 = x0 - i2 + C.yyy;
                vec3 x3 = x0 - D.yyy;
                i = mod289(i);
                vec4 p = permute( permute( permute(
                            i.z + vec4(0.0, i1.z, i2.z, 1.0 ))
                        + i.y + vec4(0.0, i1.y, i2.y, 1.0 ))
                        + i.x + vec4(0.0, i1.x, i2.x, 1.0 ));
                float n_ = 0.142857142857;
                vec3 ns = n_ * D.wyz - D.xzx;
                vec4 j = p - 49.0 * floor(p * ns.z);
                vec4 x_ = floor(j * ns.z);
                vec4 y_ = floor(j - 7.0 * x_ );
                vec4 x = x_ *ns.x + ns.yyyy;
                vec4 y = y_ *ns.x + ns.yyyy;
                vec4 h = 1.0 - abs(x) - abs(y);
                vec4 b0 = vec4( x.xy, y.xy );
                vec4 b1 = vec4( x.zw, y.zw );
                vec4 s0 = floor(b0)*2.0 + 1.0;
                vec4 s1 = floor(b1)*2.0 + 1.0;
                vec4 sh = -step(h, vec4(0.0));
                vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy ;
                vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww ;
                vec3 p0 = vec3(a0.xy,h.x);
                vec3 p1 = vec3(a0.zw,h.y);
                vec3 p2 = vec3(a1.xy,h.z);
                vec3 p3 = vec3(a1.zw,h.w);
                vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
                p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
                vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
                m = m * m;
                return 42.0 * dot( m*m, vec4( dot(p0,x0), dot(p1,x1),
                                                dot(p2,x2), dot(p3,x3) ) );
            }

            void main() {
                vPosition = position;
                vRandom = aRandom;
                
                // Slowed down the noise animation slightly for a more fluid, majestic feel
                float noise = snoise(vec3(position.x * uNoiseFreq, position.y * uNoiseFreq + uTime * 0.15, position.z * uNoiseFreq + uTime * 0.1));
                vNoise = noise;
                
                vec3 newPosition = position + normal * noise * uNoiseAmp;
                vec4 mvPosition = modelViewMatrix * vec4(newPosition, 1.0);
                gl_Position = projectionMatrix * mvPosition;
                
                // Base particle size is much smaller, but "star" particles (high aRandom) are larger
                float baseSize = 3.5;
                if (aRandom > 0.98) baseSize = 10.0; 
                
                gl_PointSize = (baseSize * uPixelRatio / -mvPosition.z) * (1.0 + noise * 0.3);
            }
        `;

        const fragmentShader = `
            varying vec3 vPosition;
            varying float vNoise;
            varying float vRandom;
            uniform float uTime;

            void main() {
                float dist = distance(gl_PointCoord, vec2(0.5));
                if (dist > 0.5) discard;
                
                // Image B specific color palette
                vec3 darkPurple = vec3(0.05, 0.0, 0.15); // Deep gaps
                vec3 electricBlue = vec3(0.0, 0.3, 1.0); // Cool edges
                vec3 neonPink = vec3(1.0, 0.1, 0.8);     // Highlights
                vec3 brightPurple = vec3(0.4, 0.0, 1.0); // Midtones
                
                // Mix colors based on horizontal position to get that blue-to-purple gradient across the sphere
                float dirMix = smoothstep(-1.0, 1.0, vPosition.x);
                vec3 baseColor = mix(electricBlue, brightPurple, dirMix);
                
                // Map the deep purples to the valleys of the noise, and neon pink to the peaks
                vec3 color = mix(darkPurple, baseColor, smoothstep(-0.5, 0.1, vNoise));
                color = mix(color, neonPink, smoothstep(0.3, 0.8, vNoise));
                
                float alpha = smoothstep(0.5, 0.1, dist);
                
                // Apply the sparkle effect for the "stars"
                if (vRandom > 0.98) {
                    color = mix(color, vec3(1.0, 0.9, 1.0), 0.9); // Make stars nearly white
                    alpha *= 1.2;
                } else {
                    alpha *= (0.2 + max(0.0, vNoise) * 0.5); // Keep normal dust softer and slightly transparent
                }
                
                gl_FragColor = vec4(color, alpha);
            }
        `;

        // Increased particle count for the dense, wispy gaseous look
        const particleCount = 65000; 
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const normals = new Float32Array(particleCount * 3);
        const randoms = new Float32Array(particleCount); // New array for star effect

        for (let i = 0; i < particleCount; i++) {
            const u = Math.random();
            const v = Math.random();
            const theta = u * 2.0 * Math.PI;
            const phi = Math.acos(2.0 * v - 1.0);
            
            const radius = 1.1 + (Math.random() - 0.5) * 0.1; 

            const x = radius * Math.sin(phi) * Math.cos(theta);
            const y = radius * Math.sin(phi) * Math.sin(theta);
            const z = radius * Math.cos(phi);

            positions[i * 3] = x;
            positions[i * 3 + 1] = y;
            positions[i * 3 + 2] = z;

            const vec = new THREE.Vector3(x, y, z).normalize();
            normals[i * 3] = vec.x;
            normals[i * 3 + 1] = vec.y;
            normals[i * 3 + 2] = vec.z;
            
            randoms[i] = Math.random(); // Assign a random value to each particle
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('normal', new THREE.BufferAttribute(normals, 3));
        geometry.setAttribute('aRandom', new THREE.BufferAttribute(randoms, 1)); // Bind it to the shader

        const uniformData = {
            uTime: { value: 0.0 },
            uNoiseFreq: { value: 1.2 }, // Lowered frequency for larger, sweeping folds
            uNoiseAmp: { value: 0.55 }, // Increased amplitude for deeper valleys
            uPixelRatio: { value: Math.min(window.devicePixelRatio, 2) }
        };

        const shaderMaterial = new THREE.ShaderMaterial({
            vertexShader: vertexShader,
            fragmentShader: fragmentShader,
            uniforms: uniformData,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const particleSystem = new THREE.Points(geometry, shaderMaterial);
        scene.add(particleSystem);

        const renderScene = new THREE.RenderPass(scene, camera);
        
        // Carefully tuned bloom. Lower strength, higher threshold so only the bright pinks and stars glow intensely
        const bloomPass = new THREE.UnrealBloomPass(
            new THREE.Vector2(container.clientWidth, container.clientHeight), 
            1.1,  // strength
            0.8,  // radius
            0.15  // threshold
        );

        const composer = new THREE.EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);

        const clock = new THREE.Clock();

        function renderFrame() {
            requestAnimationFrame(renderFrame);
            
            const elapsedTime = clock.getElapsedTime();
            uniformData.uTime.value = elapsedTime;

            // Slowed down the rotation so you can appreciate the folds
            particleSystem.rotation.y = elapsedTime * 0.03;
            particleSystem.rotation.x = Math.sin(elapsedTime * 0.05) * 0.05;

            composer.render();
        }

        renderFrame();

        window.addEventListener('resize', () => {
            const width = container.clientWidth;
            const height = container.clientHeight;
            
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            
            renderer.setSize(width, height);
            composer.setSize(width, height);
            uniformData.uPixelRatio.value = Math.min(window.devicePixelRatio, 2);
        });
    </script>
</body>
</html>
