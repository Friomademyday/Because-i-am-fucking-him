<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Particle Orb</title>
    <style>
        margin: 0;
        padding: 0;
        background-color: #050505;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        width: 100vw;
        font-family: sans-serif;
    }
    canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
    }
    #control-panel {
        position: absolute;
        bottom: 50px;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 15px;
    }
    button {
        background: rgba(255, 255, 255, 0.1);
        color: white;
        border: 1px solid rgba(255, 255, 255, 0.3);
        padding: 12px 24px;
        font-size: 16px;
        border-radius: 25px;
        cursor: pointer;
        transition: all 0.3s ease;
        backdrop-filter: blur(5px);
    }
    button:hover {
        background: rgba(255, 255, 255, 0.2);
        border-color: rgba(255, 255, 255, 0.6);
        box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
    }
    button:active {
        transform: scale(0.95);
    }
    #status {
        color: rgba(255, 255, 255, 0.6);
        font-size: 14px;
        letter-spacing: 2px;
        text-transform: uppercase;
    }
    </style>
</head>
<body>

    <canvas id="orbCanvas"></canvas>

    <div id="control-panel">
        <div id="status">Orb Status: Still</div>
        <button id="actionBtn">Start AI Speaking Simulation</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
    const canvas = document.getElementById('orbCanvas');
    const actionBtn = document.getElementById('actionBtn');
    const statusText = document.getElementById('status');

    let isSpeaking = false;

    const scene = new THREE.Scene();
    
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 400;

    const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    const particleCount = 25000;
    const geometry = new THREE.BufferGeometry();
    
    const positions = new Float32Array(particleCount * 3);
    const colors = new Float32Array(particleCount * 3);
    const initialPositions = new Float32Array(particleCount * 3);
    const randomDirections = new Float32Array(particleCount * 3);
    const speeds = new Float32Array(particleCount);

    const baseRadius = 120;

    for (let i = 0; i < particleCount; i++) {
        const u = Math.random();
        const v = Math.random();
        const theta = u * 2.0 * Math.PI;
        const phi = Math.acos(2.0 * v - 1.0);
        
        const x = baseRadius * Math.sin(phi) * Math.cos(theta);
        const y = baseRadius * Math.sin(phi) * Math.sin(theta);
        const z = baseRadius * Math.cos(phi);

        positions[i * 3] = x;
        positions[i * 3 + 1] = y;
        positions[i * 3 + 2] = z;

        initialPositions[i * 3] = x;
        initialPositions[i * 3 + 1] = y;
        initialPositions[i * 3 + 2] = z;

        const length = Math.sqrt(x*x + y*y + z*z);
        randomDirections[i * 3] = x / length;
        randomDirections[i * 3 + 1] = y / length;
        randomDirections[i * 3 + 2] = z / length;

        speeds[i] = 0.5 + Math.random() * 2.5;

        const mixRatio = Math.random();
        if (mixRatio < 0.4) {
            colors[i * 3] = 0.1;
            colors[i * 3 + 1] = 0.6;
            colors[i * 3 + 2] = 1.0;
        } else if (mixRatio < 0.8) {
            colors[i * 3] = 0.5;
            colors[i * 3 + 1] = 0.1;
            colors[i * 3 + 2] = 0.9;
        } else {
            colors[i * 3] = 0.9;
            colors[i * 3 + 1] = 0.9;
            colors[i * 3 + 2] = 1.0;
        }
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const canvasTexture = document.createElement('canvas');
    canvasTexture.width = 16;
    canvasTexture.height = 16;
    const ctx = canvasTexture.getContext('2d');
    const gradient = ctx.createRadialGradient(8, 8, 0, 8, 8, 8);
    gradient.addColorStop(0, 'rgba(255,255,255,1)');
    gradient.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, 16, 16);
    const texture = new THREE.CanvasTexture(canvasTexture);

    const material = new THREE.PointsMaterial({
        size: 3.5,
        map: texture,
        vertexColors: true,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false
    });

    const particleSystem = new THREE.Points(geometry, material);
    scene.add(particleSystem);

    let clock = new THREE.Clock();
    let transitionProgress = 0;

    function animate() {
        requestAnimationFrame(animate);

        const elapsedTime = clock.getElapsedTime();
        const positionsAttribute = geometry.attributes.position;
        
        if (isSpeaking) {
            if (transitionProgress < 1) {
                transitionProgress += 0.02;
            }
        } else {
            if (transitionProgress > 0) {
                transitionProgress -= 0.02;
            }
        }

        for (let i = 0; i < particleCount; i++) {
            const ix = i * 3;
            const iy = i * 3 + 1;
            const iz = i * 3 + 2;

            const initX = initialPositions[ix];
            const initY = initialPositions[iy];
            const initZ = initialPositions[iz];

            const dirX = randomDirections[ix];
            const dirY = randomDirections[iy];
            const dirZ = randomDirections[iz];

            const pSpeed = speeds[i];

            const waveX = Math.sin(elapsedTime * 4 + initY * 0.05) * 4;
            const waveY = Math.cos(elapsedTime * 4 + initX * 0.05) * 4;
            const waveZ = Math.sin(elapsedTime * 4 + initZ * 0.05) * 4;

            const idleX = initX + waveX;
            const idleY = initY + waveY;
            const idleZ = initZ + waveZ;

            const burstFrequency = 8.0;
            const burstAmplitude = 45.0;
            
            const noiseFactor = Math.sin(elapsedTime * burstFrequency + (initX + initY + initZ) * 0.01);
            const dynamicBurst = burstAmplitude * (0.4 + 0.6 * Math.sin(elapsedTime * 12 + pSpeed));
            
            const speakX = initX + dirX * dynamicBurst * Math.abs(noiseFactor) + Math.sin(elapsedTime * 10 + i) * 12;
            const speakY = initY + dirY * dynamicBurst * Math.abs(noiseFactor) + Math.cos(elapsedTime * 10 + i) * 12;
            const speakZ = initZ + dirZ * dynamicBurst * Math.abs(noiseFactor) + Math.sin(elapsedTime * 10 + i * 2) * 12;

            positionsAttribute.array[ix] = THREE.MathUtils.lerp(idleX, speakX, transitionProgress);
            positionsAttribute.array[iy] = THREE.MathUtils.lerp(idleY, speakY, transitionProgress);
            positionsAttribute.array[iz] = THREE.MathUtils.lerp(idleZ, speakZ, transitionProgress);
        }

        positionsAttribute.needsUpdate = true;

        particleSystem.rotation.y = elapsedTime * 0.05;
        particleSystem.rotation.x = elapsedTime * 0.02;

        renderer.render(scene, camera);
    }

    actionBtn.addEventListener('click', () => {
        isSpeaking = !isSpeaking;
        
        if (isSpeaking) {
            actionBtn.innerText = "Stop AI Speaking Simulation";
            statusText.innerText = "Orb Status: AI Speaking...";
            statusText.style.color = "#00e5ff";
        } else {
            actionBtn.innerText = "Start AI Speaking Simulation";
            statusText.innerText = "Orb Status: Still";
            statusText.style.color = "rgba(255, 255, 255, 0.6)";
        }
    });

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
    </script>
</body>
</html>
